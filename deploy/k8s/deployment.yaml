apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraforge
  labels:
    app: terraforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terraforge
  template:
    metadata:
      labels:
        app: terraforge
    spec:
      containers:
        - name: terraforge
          image: huzjie/terraforge:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
